<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zaman Perdesi Music Platform</title>
  
  <!-- Google Fonts & Tailwind -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              dark: '#0b0f19',
              card: '#131827',
              hover: '#1f293d',
              accent: '#00d2ff',
              blue: '#3b82f6'
            }
          }
        }
      }
    }
  </script>

  <!-- FIREBASE & BİLDİRİM ALTYAPISI -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getMessaging, getToken, onMessage } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-messaging.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAwaM-Ntl6nTabgexfTsmx-pxblrekCsHA",
      authDomain: "zamanperdesimusic-c9150.firebaseapp.com",
      projectId: "zamanperdesimusic-c9150",
      storageBucket: "zamanperdesimusic-c9150.firebasestorage.app",
      messagingSenderId: "1041697921203",
      appId: "1:1041697921203:web:248e3208516d9e5cbe14fe"
    };

    const app = initializeApp(firebaseConfig);
    const messaging = getMessaging(app);

    window.requestNotificationPermission = async function() {
      try {
        const permission = await Notification.requestPermission();
        if (permission === 'granted') {
          const token = await getToken(messaging, { vapidKey: 'SENIN_VAPID_KEY_BURAYA' });
          console.log('FCM Token alındı:', token);
          alert('Bildirimler başarıyla aktif edildi!');
        } else {
          alert('Bildirim izni reddedildi.');
        }
      } catch (error) {
        console.error('Bildirim izni alınamadı:', error);
      }
    };

    onMessage(messaging, (payload) => {
      console.log('Yeni Firebase Bildirimi:', payload);
      if ("Notification" in window && Notification.permission === "granted") {
        new Notification(payload.notification.title, {
          body: payload.notification.body,
          icon: '/logo.png'
        });
      }
    });
  </script>

  <!-- CSS DÜZELTMELERİ -->
  <style>
    body { user-select: none; -webkit-tap-highlight-color: transparent; }
    nav { position: fixed !important; bottom: 0 !important; left: 0 !important; right: 0 !important; width: 100% !important; max-width: 28rem; margin: 0 auto; }
    input[type="range"] { accent-color: #00d2ff; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #242735; border-radius: 4px; }
  </style>
</head>

<body class="font-sans antialiased bg-gray-50 dark:bg-black text-gray-900 dark:text-gray-100 transition-colors duration-300 pb-24">

  <!-- HEADER & BUTONLAR -->
  <header class="p-4 bg-white/90 dark:bg-brand-dark/90 backdrop-blur-md border-b border-gray-200 dark:border-gray-800 flex items-center justify-between z-30 sticky top-0 transition-colors duration-300">
    <div class="flex items-center gap-2">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-brand-blue to-brand-accent flex items-center justify-center text-black font-extrabold text-lg shadow-lg shadow-cyan-500/20">Z</div>
      <div>
        <h1 class="text-base font-bold tracking-tight bg-gradient-to-r from-gray-900 via-gray-700 dark:from-white dark:via-gray-200 to-brand-accent bg-clip-text text-transparent">Zaman Perdesi</h1>
        <p class="text-[10px] text-brand-accent font-medium -mt-1 tracking-wider uppercase">MUSIC PLATFORM</p>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <!-- BİLDİRİM İZNİ BUTONU -->
      <button onclick="requestNotificationPermission()" class="w-8 h-8 rounded-full bg-gray-100 dark:bg-brand-card hover:bg-gray-200 dark:hover:bg-brand-hover border border-gray-300 dark:border-gray-800 flex items-center justify-center text-brand-accent text-xs transition" title="Bildirimleri Aç">
        <i class="fa-solid fa-bell"></i>
      </button>
      
      <!-- TEMA DEĞİŞTİRME BUTONU -->
      <button onclick="toggleTheme()" class="w-8 h-8 rounded-full bg-gray-100 dark:bg-brand-card hover:bg-gray-200 dark:hover:bg-brand-hover border border-gray-300 dark:border-gray-800 flex items-center justify-center text-brand-accent text-xs transition" title="Tema Değiştir">
        <i id="themeIcon" class="fa-solid fa-moon"></i>
      </button>
    </div>
  </header>

  <!-- ANA İÇERİK ALANI -->
  <main class="p-4 max-w-md mx-auto space-y-6">
    
    <!-- ALBÜM YÜKLEME VE 15 ŞARKI + ŞARKI SÖZLERİ BÖLÜMÜ -->
    <div class="space-y-4">
      <h3 class="text-sm font-bold text-brand-accent">Albüm Parçaları (15 Şarkı)</h3>
      
      <div class="space-y-3" id="albumTracksContainer">
        <script>
          document.addEventListener("DOMContentLoaded", () => {
            const container = document.getElementById("albumTracksContainer");
            if (container) {
              let html = "";
              for (let i = 1; i <= 15; i++) {
                html += `
                  <div class="p-3 bg-gray-50 dark:bg-brand-card/50 rounded-xl border border-gray-200 dark:border-gray-800 space-y-2">
                    <span class="text-xs font-semibold text-brand-blue">Parça #${i}</span>
                    <input type="text" id="trackName_${i}" placeholder="Şarkı #${i} Adı" class="w-full bg-white dark:bg-brand-dark text-xs p-2.5 rounded-xl border border-gray-200 dark:border-gray-800 focus:outline-none focus:border-brand-accent">
                    <input type="file" id="trackFile_${i}" accept="audio/*" class="w-full text-xs text-gray-500 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-brand-accent/10 file:text-brand-accent hover:file:bg-brand-accent/20 cursor-pointer">
                    <!-- ŞARKI SÖZLERİ KUTUCUĞU -->
                    <textarea id="trackLyrics_${i}" rows="3" placeholder="Şarkı #${i} Sözleri..." class="w-full bg-white dark:bg-brand-dark text-xs p-2.5 rounded-xl border border-gray-200 dark:border-gray-800 focus:outline-none focus:border-brand-accent resize-y"></textarea>
                  </div>
                `;
              }
              container.innerHTML = html;
            }
          });
        </script>
      </div>
    </div>

  </main>

  <!-- ALT NAVİGASYON ÇUBUĞU -->
  <nav class="p-2 bg-white/90 dark:bg-brand-dark/90 backdrop-blur-md border-t border-gray-200 dark:border-gray-800 flex justify-around items-center z-30">
    <a href="#" class="flex flex-col items-center text-brand-accent text-[10px] font-medium"><i class="fa-solid fa-house text-sm mb-0.5"></i>Ana Sayfa</a>
    <a href="#" class="flex flex-col items-center text-gray-400 hover:text-brand-accent text-[10px] font-medium"><i class="fa-solid fa-users text-sm mb-0.5"></i>Sanatçılar</a>
    <a href="#" class="flex flex-col items-center text-gray-400 hover:text-brand-accent text-[10px] font-medium"><i class="fa-solid fa-circle-plus text-sm mb-0.5"></i>Yükle</a>
    <a href="#" class="flex flex-col items-center text-gray-400 hover:text-brand-accent text-[10px] font-medium"><i class="fa-solid fa-user text-sm mb-0.5"></i>Profilim</a>
  </nav>

  <script>
    function toggleTheme() {
      document.documentElement.classList.toggle('dark');
      const icon = document.getElementById('themeIcon');
      if (document.documentElement.classList.contains('dark')) {
        icon.className = "fa-solid fa-moon";
      } else {
        icon.className = "fa-solid fa-sun";
      }
    }
  </script>
</body>
</html>
