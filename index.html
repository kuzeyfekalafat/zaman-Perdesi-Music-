<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Zaman Perdesi Music</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { black: '#0a0a0c', dark: '#121318', card: '#1a1c23', accent: '#00d2ff', blue: '#0072ff' }
          }
        }
      }
    }
  </script>
</head>
<body class="font-sans antialiased h-screen overflow-hidden flex justify-center bg-black text-gray-100">

  <audio id="audioPlayer" preload="auto"></audio>

  <div class="w-full max-w-md h-full bg-brand-black flex flex-col relative overflow-hidden shadow-2xl border-x border-gray-800">

    <!-- HEADER -->
    <header class="p-4 bg-brand-dark border-b border-gray-800 flex items-center justify-between z-20 flex-shrink-0">
      <div class="flex items-center gap-2">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-brand-blue to-brand-accent flex items-center justify-center text-black font-extrabold text-lg">Z</div>
        <div>
          <h1 class="text-base font-bold text-white">Zaman Perdesi</h1>
          <p class="text-[10px] text-brand-accent font-medium uppercase">MUSIC PLATFORM</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button type="button" onclick="toggleTheme()" class="w-8 h-8 rounded-full bg-brand-card flex items-center justify-center text-brand-accent text-xs cursor-pointer">
          <i id="themeIcon" class="fa-solid fa-moon"></i>
        </button>
        <div class="flex items-center gap-1.5 bg-brand-card px-3 py-1.5 rounded-full">
          <i class="fa-solid fa-user-check text-brand-accent text-xs"></i>
          <span class="text-xs font-semibold">Kuzeyfe</span>
        </div>
      </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="flex-1 overflow-y-auto p-4 space-y-6 pb-24">
      
      <!-- TAB 1: ANA SAYFA -->
      <section id="tab-home" class="tab-content space-y-4">
        <h3 class="text-sm font-bold text-white flex items-center gap-2"><i class="fa-solid fa-fire text-brand-accent"></i> Öne Çıkan Eserler</h3>
        <div id="feedList" class="space-y-2">
          <div onclick="playSample()" class="p-3 bg-brand-card rounded-xl border border-gray-800 flex justify-between items-center cursor-pointer">
            <div>
              <h4 class="text-xs font-bold text-white">Ateş Ve Kumsal</h4>
              <p class="text-[10px] text-gray-400">Hamza Kalafat</p>
            </div>
            <i class="fa-solid fa-play text-brand-accent text-xs"></i>
          </div>
        </div>
      </section>

      <!-- TAB 2: SANATÇILAR -->
      <section id="tab-artists" class="tab-content hidden space-y-3">
        <h2 class="text-base font-bold text-white">Sanatçılar Kataloğu</h2>
        <div class="p-3 bg-brand-card rounded-xl border border-gray-800 text-xs text-gray-300">
          Kuzeyfe - Zaman Perdesi Kurucusu & Sanatçısı
        </div>
      </section>

      <!-- TAB 3: YÜKLE -->
      <section id="tab-upload" class="tab-content hidden space-y-3">
        <h2 class="text-base font-bold text-white">Müzik Yükle</h2>
        <input type="text" id="uploadTitle" placeholder="Şarkı Adı Giriniz..." class="w-full bg-brand-card text-xs text-white p-2.5 rounded-xl border border-gray-800">
        <button type="button" onclick="handleUpload()" class="w-full bg-brand-accent text-black font-bold text-xs py-3 rounded-xl cursor-pointer">Yayınla</button>
      </section>

      <!-- TAB 4: PROFİL -->
      <section id="tab-profile" class="tab-content hidden space-y-3">
        <h2 class="text-base font-bold text-white">Profilim</h2>
        <div class="p-3 bg-brand-card rounded-xl border border-gray-800 text-xs text-gray-300">
          E-Posta: kuzeyfe198634@gmail.com
        </div>
      </section>

    </main>

    <!-- NAV BAR -->
    <nav class="bg-brand-dark border-t border-gray-800 flex justify-around py-3 z-40 flex-shrink-0">
      <button type="button" onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center gap-1 text-brand-accent cursor-pointer p-1">
        <i class="fa-solid fa-house text-base"></i><span class="text-[10px] font-semibold">Ana Sayfa</span>
      </button>
      <button type="button" onclick="switchTab('artists')" id="nav-artists" class="flex flex-col items-center gap-1 text-gray-400 cursor-pointer p-1">
        <i class="fa-solid fa-users text-base"></i><span class="text-[10px] font-semibold">Sanatçılar</span>
      </button>
      <button type="button" onclick="switchTab('upload')" id="nav-upload" class="flex flex-col items-center gap-1 text-gray-400 cursor-pointer p-1">
        <i class="fa-solid fa-circle-plus text-base"></i><span class="text-[10px] font-semibold">Yükle</span>
      </button>
      <button type="button" onclick="switchTab('profile')" id="nav-profile" class="flex flex-col items-center gap-1 text-gray-400 cursor-pointer p-1">
        <i class="fa-solid fa-user text-base"></i><span class="text-[10px] font-semibold">Profilim</span>
      </button>
    </nav>

  </div>

  <script>
    function switchTab(tabName) {
      var contents = document.querySelectorAll('.tab-content');
      for (var i = 0; i < contents.length; i++) {
        contents[i].classList.add('hidden');
      }
      var target = document.getElementById('tab-' + tabName);
      if (target) {
        target.classList.remove('hidden');
      }

      var tabs = ['home', 'artists', 'upload', 'profile'];
      for (var j = 0; j < tabs.length; j++) {
        var btn = document.getElementById('nav-' + tabs[j]);
        if (btn) {
          if (tabs[j] === tabName) {
            btn.className = 'flex flex-col items-center gap-1 text-brand-accent cursor-pointer p-1';
          } else {
            btn.className = 'flex flex-col items-center gap-1 text-gray-400 cursor-pointer p-1';
          }
        }
      }
    }

    function toggleTheme() {
      document.documentElement.classList.toggle('dark');
      var icon = document.getElementById('themeIcon');
      if (icon) {
        if (document.documentElement.classList.contains('dark')) {
          icon.className = 'fa-solid fa-moon';
        } else {
          icon.className = 'fa-solid fa-sun';
        }
      }
    }

    function playSample() {
      var audio = document.getElementById('audioPlayer');
      audio.src = 'https://actions.google.com/sounds/v1/ambiences/outdoor_synth.ogg';
      audio.play();
      alert('Şarkı çalınmaya başladı!');
    }

    function handleUpload() {
      var input = document.getElementById('uploadTitle');
      if (input && input.value.trim() !== '') {
        alert('Eser yayınlandı: ' + input.value);
        input.value = '';
        switchTab('home');
      } else {
        alert('Lütfen bir şarkı adı girin!');
      }
    }
  </script>
</body>
</html>
