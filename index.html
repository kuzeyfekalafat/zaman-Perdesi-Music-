<head>

    <!-- FontAwesome Orijinal İkonlar için Kütüphane -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Firebase SDK v9 (Modular CDN) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail, signOut, onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, doc, setDoc, updateDoc, deleteDoc, increment, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAnmVE-9T0T6lDhQeafto4V-p0R6ZexGSA",
            authDomain: "zamanperdesimusic-c3150.firebaseapp.com",
            projectId: "zamanperdesimusic-c3150",
            storageBucket: "zamanperdesimusic-c3150.appspot.com",
            messagingSenderId: "1041697921243",
            appId: "1:1041697921243:web:298a0206d4f9cebd14fe"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);

        window.firebaseApp = { auth, db, storage, signInWithEmailAndPassword, sendPasswordResetEmail, signOut, updateProfile, collection, addDoc, getDocs, doc, setDoc, updateDoc, deleteDoc, increment, ref, uploadBytes, getDownloadURL };

        // SENİN ANA YÖNETİCİ MAİLİN (Ömür Boyu Tam Yetki)
        const ADMIN_EMAIL = "kuzeyfe198634@gmail.com";

        onAuthStateChanged(auth, (user) => {
            const profileTag = document.getElementById('userProfileTag');
            const navTabsContainer = document.getElementById('navTabs');

            // Önce mevcut dinamik yönetici sekmesini ve eklentileri temizleyelim
            const existingAdminTab = document.getElementById('adminTabBtn');
            if (existingAdminTab) existingAdminTab.remove();

            const existingAdminContent = document.getElementById('yoneticiPaneli');
            if (existingAdminContent) existingAdminContent.remove();

            if (user && user.email === ADMIN_EMAIL) {
                window.isAdminLoggedIn = true;
                profileTag.innerText = "Patron Kuzeyfe ✓";

                // 1. Sekmelere "Yönetici Paneli" butonunu ekle
                const adminBtn = document.createElement('button');
                adminBtn.className = 'tab-btn admin-tab-btn';
                adminBtn.id = 'adminTabBtn';
                adminBtn.innerHTML = '🛡 Patron Paneli';
                adminBtn.onclick = () => switchTab('yoneticiPaneli');
                navTabsContainer.appendChild(adminBtn);

                // 2. Tam yetkili Yönetici Paneli HTML içeriğini oluştur
                const containerDiv = document.querySelector('.container');
                const adminSection = document.createElement('div');
                adminSection.id = 'yoneticiPaneli';
                adminSection.className = 'section-content';
                adminSection.innerHTML = `
                    <h2 class="section-title" style="color: var(--admin-red);">🛡 Patron Yönetici Paneli (Tam Yetki)</h2>
                    <div class="admin-card">
                        <p style="font-size: 0.9rem; color: var(--gold); margin-bottom: 6px;">Hoş geldin Patron Kuzeyfe Kalafat! 👑</p>
                        <p style="font-size: 0.82rem; color: var(--text-muted);">Bu panel, veritabanı yönetimi ve içerik denetimi için sadece sana özel olarak korunmaktadır.</p>
                    </div>
                    <div class="content-card">
                        <h4 style="font-size: 0.95rem; color: var(--gold); margin-bottom: 10px;">⚡ Hızlı Patron İşlemleri</h4>
                        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                            <button class="btn-gold" style="flex: 1; min-width: 150px;" onclick="switchTab('sarkiEkle')">➕ Hızlı Şarkı Ekle</button>
                            <button class="btn-gold" style="flex: 1; min-width: 150px;" onclick="switchTab('albumEkle')">💿 Hızlı Albüm Ekle</button>
                            <button class="btn-gold" style="flex: 1; min-width: 150px;" onclick="switchTab('videoEkle')">📹 Hızlı Video Ekle</button>
                        </div>
                    </div>
                    <div class="content-card" style="margin-top: 15px;">
                        <h4 style="font-size: 0.95rem; color: var(--admin-red); margin-bottom: 10px;">⚠️ Kritik Oturum İşlemi</h4>
                        <button class="btn-gold" style="background: var(--admin-red); color: white;" onclick="cloudSignOut()">Güvenli Çıkış Yap</button>
                    </div>
                `;
                containerDiv.appendChild(adminSection);

            } else {
                window.isAdminLoggedIn = false;
                if(user) {
                    // Eğer yanlışlıkla başka bir mail girilirse oturumu kapat
                    signOut(auth);
                }
                profileTag.innerText = "Patron Girişi";
            }
        });
    </script>
