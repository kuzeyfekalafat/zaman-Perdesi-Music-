<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zaman Perdesi</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white h-screen flex justify-center overflow-hidden">
  <div class="w-full max-w-md h-full bg-zinc-950 flex flex-col relative">
    
    <header class="p-4 border-b border-zinc-800 flex justify-between items-center">
      <h1 class="font-bold text-cyan-400">Zaman Perdesi</h1>
      <button onclick="toggleTheme()" class="text-xs bg-zinc-800 px-3 py-1 rounded-full cursor-pointer">Tema</button>
    </header>

    <main class="flex-1 overflow-y-auto p-4 pb-20">
      <div id="tab-home" class="page space-y-3">
        <h2 class="text-sm font-bold text-cyan-400">Ana Sayfa</h2>
        <div onclick="alert('Şarkı çalınıyor...')" class="p-3 bg-zinc-900 rounded-xl cursor-pointer">Ateş Ve Kumsal (Çal)</div>
      </div>
      <div id="tab-artists" class="page hidden space-y-3">
        <h2 class="text-sm font-bold text-cyan-400">Sanatçılar</h2>
        <p class="text-xs">Kuzeyfe - Kurucu</p>
      </div>
      <div id="tab-upload" class="page hidden space-y-3">
        <h2 class="text-sm font-bold text-cyan-400">Yükle</h2>
        <input id="songName" placeholder="Şarkı Adı" class="w-full bg-zinc-900 p-2 text-xs rounded border border-zinc-800 text-white">
        <button onclick="uploadSong()" class="w-full bg-cyan-400 text-black text-xs font-bold py-2 rounded cursor-pointer">Yayınla</button>
      </div>
      <div id="tab-profile" class="page hidden space-y-3">
        <h2 class="text-sm font-bold text-cyan-400">Profil</h2>
        <p class="text-xs">kuzeyfe198634@gmail.com</p>
      </div>
    </main>

    <nav class="absolute bottom-0 w-full bg-zinc-900 border-t border-zinc-800 flex justify-around py-3">
      <button onclick="goTab('home')" class="text-cyan-400 text-xs cursor-pointer">Ana Sayfa</button>
      <button onclick="goTab('artists')" class="text-zinc-400 text-xs cursor-pointer">Sanatçılar</button>
      <button onclick="goTab('upload')" class="text-zinc-400 text-xs cursor-pointer">Yükle</button>
      <button onclick="goTab('profile')" class="text-zinc-400 text-xs cursor-pointer">Profilim</button>
    </nav>

  </div>

  <script>
    function goTab(name) {
      var pages = document.querySelectorAll('.page');
      for (var i = 0; i < pages.length; i++) {
        pages[i].classList.add('hidden');
      }
      var target = document.getElementById('tab-' + name);
      if (target) {
        target.classList.remove('hidden');
      }
    }

    function toggleTheme() {
      document.body.classList.toggle('bg-white');
      document.body.classList.toggle('text-black');
    }

    function uploadSong() {
      var input = document.getElementById('songName');
      if (input && input.value.trim() !== '') {
        alert('Yayınlandı: ' + input.value);
        input.value = '';
        goTab('home');
      } else {
        alert('Şarkı adı yazın!');
      }
    }
  </script>
</body>
</html>
