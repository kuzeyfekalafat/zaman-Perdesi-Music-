<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zaman Perdesi Music</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#ecfeff',
              400: '#22d3ee',
              500: '#06b6d4',
              600: '#0891b2',
              900: '#164e63',
            },
            darkbg: '#0b0f19',
            cardbg: '#111827',
            panelbg: '#1f2937'
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0b0f19;
      color: #f3f4f6;
      -webkit-tap-highlight-color: transparent;
    }
    /* Custom Range Slider */
    input[type=range] {
      -webkit-appearance: none;
      background: transparent;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 16px;
      width: 16px;
      border-radius: 50%;
      background: #06b6d4;
      cursor: pointer;
      margin-top: -6px;
      box-shadow: 0 0 10px rgba(6, 182, 212, 0.8);
    }
    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 4px;
      cursor: pointer;
      background: #374151;
      border-radius: 2px;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #374151;
      border-radius: 4px;
    }
  </style>
</head>
<body class="flex flex-col min-h-screen justify-between items-center bg-darkbg text-gray-100">

  <!-- Bildirim Kutusu -->
  <div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 transform -translate-y-20 opacity-0 transition-all duration-300 bg-brand-500 text-black px-5 py-2.5 rounded-full shadow-lg font-semibold text-sm flex items-center gap-2 pointer-events-none">
    <i class="fa-solid fa-circle-info"></i> <span id="toast-msg">Bildirim</span>
  </div>

  <!-- Ana Container (Mobil Görünüm Odaklı) -->
  <div class="w-full max-w-md min-h-screen bg-cardbg flex flex-col justify-between relative shadow-2xl overflow-hidden border-x border-gray-800/50">

    <!-- Üst Başlık / Header -->
    <header class="p-4 flex items-center justify-between border-b border-gray-800/80 bg-cardbg/80 backdrop-blur-md sticky top-0 z-20">
      <button id="btn-back" onclick="switchView('library')" class="p-2 text-gray-400 hover:text-white transition">
        <i class="fa-solid fa-chevron-down text-lg"></i>
      </button>
      <div class="text-center">
        <h1 class="text-xs font-bold tracking-widest text-brand-400 uppercase" id="header-subtitle">ŞİMDİ ÇALIKOR</h1>
        <p class="text-sm font-semibold truncate max-w-[180px]" id="header-title">Zaman Perdesi Music</p>
      </div>
      <button onclick="toggleLike()" id="btn-like" class="p-2 text-gray-400 hover:text-red-500 transition">
        <i class="fa-regular fa-heart text-lg" id="icon-like"></i>
      </button>
    </header>

    <!-- İçerik Alanı -->
    <main class="flex-1 overflow-y-auto p-4 custom-scrollbar pb-24">

      <!-- 1. GÖRÜNÜM: OYNATICI (PLAYER VIEW) -->
      <section id="view-player" class="flex flex-col items-center gap-5">
        
        <!-- Kapak Resmi / Video Kiti -->
        <div class="w-64 h-64 sm:w-72 sm:h-72 rounded-2xl overflow-hidden shadow-2xl relative group bg-gray-800 border border-gray-700/50">
          <img id="player-cover" 
               src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=500&auto=format&fit=crop" 
               alt="Kapak Resmi" 
               class="w-full h-full object-cover transition duration-300"
               onerror="handleImageError(this)">
          <video id="player-video" class="w-full h-full object-cover hidden" loop muted></video>
          
          <!-- Medya Türü Rozeti -->
          <span id="media-badge" class="absolute top-3 right-3 bg-black/60 backdrop-blur-md px-2.5 py-1 rounded-full text-[10px] font-bold text-brand-400 border border-brand-500/30">
            <i class="fa-solid fa-music"></i> Audio
          </span>
        </div>

        <!-- Şarkı & Sanatçı Bilgisi -->
        <div class="text-center w-full px-2">
          <h2 id="player-title" class="text-xl font-bold text-white truncate">Ateş Ve Kumsal</h2>
          <p id="player-artist" class="text-sm font-medium text-brand-400 truncate mt-0.5">Kuzeyfe kalafat</p>
        </div>

        <!-- Oynatma / Süre Çubuğu Paneli -->
        <div class="w-full bg-panelbg/60 p-4 rounded-2xl border border-gray-800 flex flex-col gap-3">
          <!-- Progress Bar -->
          <div>
            <input type="range" id="seek-slider" min="0" max="100" value="0" class="w-full" oninput="onSeek(this.value)">
            <div class="flex justify-between text-xs text-gray-400 mt-1 font-mono">
              <span id="current-time">00:00</span>
              <span id="total-duration">00:00</span>
            </div>
          </div>

          <!-- Kumanda Butonları -->
          <div class="flex items-center justify-center gap-6 pt-1">
            <button onclick="prevTrack()" class="text-gray-400 hover:text-white text-xl transition active:scale-95">
              <i class="fa-solid fa-backward-step"></i>
            </button>
            <button id="btn-play" onclick="togglePlayPause()" class="w-14 h-14 rounded-full bg-brand-400 text-black flex items-center justify-center text-xl shadow-lg shadow-brand-500/30 hover:scale-105 transition active:scale-95">
              <i class="fa-solid fa-play ml-1" id="icon-play"></i>
            </button>
            <button onclick="nextTrack()" class="text-gray-400 hover:text-white text-xl transition active:scale-95">
              <i class="fa-solid fa-forward-step"></i>
            </button>
          </div>
        </div>

        <!-- Sekmeli Tab Yapısı (Sözler, Künye, Yorumlar) -->
        <div class="w-full bg-panelbg/40 rounded-2xl p-3 border border-gray-800/60">
          <div class="flex border-b border-gray-800 pb-2 mb-3 gap-1">
            <button onclick="switchTab('lyrics')" id="tab-btn-lyrics" class="flex-1 py-1.5 text-xs font-semibold text-gray-400 hover:text-white rounded-lg transition text-center flex items-center justify-center gap-1.5">
              <i class="fa-solid fa-scroll"></i> Sözler
            </button>
            <button onclick="switchTab('credits')" id="tab-btn-credits" class="flex-1 py-1.5 text-xs font-semibold text-brand-400 border-b-2 border-brand-400 transition text-center flex items-center justify-center gap-1.5">
              <i class="fa-solid fa-file-invoice"></i> Künye
            </button>
            <button onclick="switchTab('comments')" id="tab-btn-comments" class="flex-1 py-1.5 text-xs font-semibold text-gray-400 hover:text-white rounded-lg transition text-center flex items-center justify-center gap-1.5">
              <i class="fa-solid fa-comments"></i> Yorumlar
            </button>
          </div>

          <!-- Tab 1: Sözler -->
          <div id="tab-content-lyrics" class="hidden text-sm text-gray-300 leading-relaxed text-center py-2 max-h-48 overflow-y-auto custom-scrollbar italic whitespace-pre-line">
            Şarkı sözü bulunamadı.
          </div>

          <!-- Tab 2: Künye -->
          <div id="tab-content-credits" class="space-y-2 text-xs">
            <div class="flex justify-between py-1 border-b border-gray-800/40">
              <span class="text-gray-400">Söz & Müzik:</span>
              <span id="credit-songwriter" class="font-medium text-gray-200">Kuzeyfe kalafat</span>
            </div>
            <div class="flex justify-between py-1 border-b border-gray-800/40">
              <span class="text-gray-400">Aranje / Düzenleme:</span>
              <span id="credit-arranger" class="font-medium text-gray-200">Zaman Perdesi</span>
            </div>
            <div class="flex justify-between py-1">
              <span class="text-gray-400">Yapım Şirketi:</span>
              <span id="credit-label" class="font-medium text-brand-400">Zaman Perdesi Music</span>
            </div>
          </div>

          <!-- Tab 3: Yorumlar -->
          <div id="tab-content-comments" class="hidden space-y-3">
            <div id="comments-list" class="max-h-36 overflow-y-auto custom-scrollbar space-y-2 pr-1">
              <!-- Yorumlar JavaScript ile yüklenir -->
            </div>
            <div class="flex gap-2 pt-2 border-t border-gray-800">
              <input type="text" id="input-comment" placeholder="Yorum yaz..." class="flex-1 bg-gray-800/80 border border-gray-700 text-xs rounded-xl px-3 py-2 text-white focus:outline-none focus:border-brand-400">
              <button onclick="addComment()" class="bg-brand-500 hover:bg-brand-400 text-black px-3 py-2 rounded-xl text-xs font-bold transition">
                Gönder
              </button>
            </div>
          </div>
        </div>

      </section>

      <!-- 2. GÖRÜNÜM: KÜTÜPHANE / AKIŞ (LIBRARY VIEW) -->
      <section id="view-library" class="hidden space-y-4">
        <h3 class="text-sm font-bold text-gray-400 uppercase tracking-wider mb-2">Müzik Kitaplığı</h3>
        <div id="track-list" class="space-y-2">
          <!-- Şarkı Listesi Dinamik Yüklenir -->
        </div>
      </section>

      <!-- 3. GÖRÜNÜM: İÇERİK YÜKLEME (UPLOAD VIEW) -->
      <section id="view-upload" class="hidden space-y-4">
        <h3 class="text-base font-bold text-brand-400 flex items-center gap-2">
          <i class="fa-solid fa-cloud-arrow-up"></i> Yeni İçerik Yükle
        </h3>

        <!-- Yükleme Türü Seçimi -->
        <div class="flex gap-2 p-1 bg-panelbg rounded-xl border border-gray-800 text-xs">
          <button onclick="setUploadType('single')" id="type-btn-single" class="flex-1 py-2 rounded-lg bg-brand-500 text-black font-bold">Single</button>
          <button onclick="setUploadType('album')" id="type-btn-album" class="flex-1 py-2 rounded-lg text-gray-400 hover:text-white">Albüm</button>
          <button onclick="setUploadType('video')" id="type-btn-video" class="flex-1 py-2 rounded-lg text-gray-400 hover:text-white">Klip Video</button>
        </div>

        <form id="upload-form" onsubmit="handleUpload(event)" class="space-y-3 text-xs">
          <div>
            <label class="block text-gray-400 mb-1">Eser / Parça Adı</label>
            <input type="text" id="up-title" required class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-brand-400">
          </div>
          <div>
            <label class="block text-gray-400 mb-1">Sanatçı Adı</label>
            <input type="text" id="up-artist" required class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-brand-400">
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-gray-400 mb-1">Söz & Müzik</label>
              <input type="text" id="up-songwriter" placeholder="İsteğe bağlı" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-brand-400">
            </div>
            <div>
              <label class="block text-gray-400 mb-1">Aranje</label>
              <input type="text" id="up-arranger" placeholder="Zaman Perdesi" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-brand-400">
            </div>
          </div>
          <div>
            <label class="block text-gray-400 mb-1">Şarkı Sözleri</label>
            <textarea id="up-lyrics" rows="2" placeholder="Şarkı sözlerini giriniz..." class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-brand-400"></textarea>
          </div>
          <div>
            <label class="block text-gray-400 mb-1">Kapak Resmi (Görsel)</label>
            <input type="file" id="up-cover-file" accept="image/*" class="w-full text-gray-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-brand-500/20 file:text-brand-400 hover:file:bg-brand-500/30">
          </div>
          <div>
            <label class="block text-gray-400 mb-1" id="label-media-file">Ses Dosyası (MP3/WAV)</label>
            <input type="file" id="up-media-file" accept="audio/*,video/*" required class="w-full text-gray-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-brand-500/20 file:text-brand-400 hover:file:bg-brand-500/30">
          </div>

          <button type="submit" class="w-full bg-brand-500 hover:bg-brand-400 text-black font-bold py-2.5 rounded-xl transition shadow-lg shadow-brand-500/20 mt-2">
            İçeriği Yayınla
          </button>
        </form>
      </section>

      <!-- 4. GÖRÜNÜM: PROFİL / YÖNETİM (PROFILE VIEW) -->
      <section id="view-profile" class="hidden space-y-4">
        <div id="profile-container" class="bg-panelbg p-4 rounded-2xl border border-gray-800 text-center space-y-3">
          <!-- Profil Detayı JavaScript ile Dolacak -->
        </div>
      </section>

    </main>

    <!-- Alt Gezinme Menüsü (Bottom Navigation) -->
    <nav class="absolute bottom-0 left-0 right-0 h-16 bg-cardbg/95 border-t border-gray-800/80 backdrop-blur-md flex items-center justify-around z-20">
      <button onclick="switchView('player')" id="nav-player" class="flex flex-col items-center gap-1 text-brand-400">
        <i class="fa-solid fa-circle-play text-lg"></i>
        <span class="text-[10px] font-medium">Çalar</span>
      </button>
      <button onclick="switchView('library')" id="nav-library" class="flex flex-col items-center gap-1 text-gray-400 hover:text-white">
        <i class="fa-solid fa-compact-disc text-lg"></i>
        <span class="text-[10px] font-medium">Kitaplık</span>
      </button>
      <button onclick="switchView('upload')" id="nav-upload" class="flex flex-col items-center gap-1 text-gray-400 hover:text-white">
        <i class="fa-solid fa-cloud-arrow-up text-lg"></i>
        <span class="text-[10px] font-medium">Yükle</span>
      </button>
      <button onclick="switchView('profile')" id="nav-profile" class="flex flex-col items-center gap-1 text-gray-400 hover:text-white">
        <i class="fa-solid fa-user text-lg"></i>
        <span class="text-[10px] font-medium">Profil</span>
      </button>
    </nav>

  </div>

  <!-- Gizli Ses Oynatıcı Öğesi -->
  <audio id="audio-engine" class="hidden" preload="metadata"></audio>

  <script>
    // --- Varsayılan Yedek Görsel (SVG Data URI) ---
    const DEFAULT_COVER = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300' viewBox='0 0 300 300'><rect width='100%' height='100%' fill='%231f2937'/><circle cx='150' cy='150' r='60' fill='%23111827' stroke='%2306b6d4' stroke-width='4'/><path d='M140 130 L170 150 L140 170 Z' fill='%2306b6d4'/></svg>";

    // --- Örnek Başlangıç Verileri ---
    const initialTracks = [
      {
        id: "1",
        title: "Ateş Ve Kumsal",
        artist: "Kuzeyfe kalafat",
        songwriter: "Kuzeyfe kalafat",
        arranger: "Zaman Perdesi",
        label: "Zaman Perdesi Music",
        coverUrl: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=500&auto=format&fit=crop",
        mediaUrl: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
        type: "audio",
        lyrics: "Ateş ve kumsal geceye eşlik eder...\nDalgaların sesi içimde yankılanır.\nZaman perdesi aralanır yavaşça.",
        comments: [
          { user: "Ahmet", text: "Harika bir çalışma olmuş, tebrikler!" },
          { user: "Merve", text: "Aranje kalitesi çok yüksek." }
        ],
        liked: false
      },
      {
        id: "2",
        title: "Gece Ve Sis",
        artist: "Zaman Perdesi",
        songwriter: "Zaman Perdesi",
        arranger: "Zaman Perdesi Studio",
        label: "Zaman Perdesi Music",
        coverUrl: "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=500&auto=format&fit=crop",
        mediaUrl: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3",
        type: "audio",
        lyrics: "Gece çöker şehre, sis kaplar sokakları...\nSessizlik konuşur bizim yerimize.",
        comments: [],
        liked: true
      }
    ];

    // --- Durum Yönetimi (State) ---
    let tracks = JSON.parse(localStorage.getItem('zpm_tracks')) || initialTracks;
    let currentTrackIndex = 0;
    let isPlaying = false;
    let currentUploadType = 'single';
    let userRole = localStorage.getItem('zpm_role') || 'admin'; // Default admin for testing

    // HTML Element Referansları
    const audioElement = document.getElementById('audio-engine');
    const playerCover = document.getElementById('player-cover');
    const playerVideo = document.getElementById('player-video');
    const playerTitle = document.getElementById('player-title');
    const playerArtist = document.getElementById('player-artist');
    const seekSlider = document.getElementById('seek-slider');
    const currentTimeEl = document.getElementById('current-time');
    const totalDurationEl = document.getElementById('total-duration');
    const iconPlay = document.getElementById('icon-play');
    const mediaBadge = document.getElementById('media-badge');

    // --- Başlangıç Yüklemeleri ---
    window.onload = () => {
      saveTracksToStorage();
      loadTrack(currentTrackIndex, false);
      renderLibrary();
      renderProfile();
      setupAudioEvents();
    };

    function saveTracksToStorage() {
      localStorage.setItem('zpm_tracks', JSON.stringify(tracks));
    }

    // --- Kırık Resim Yakalayıcı (Broken Image Fallback) ---
    function handleImageError(imgElement) {
      imgElement.onerror = null;
      imgElement.src = DEFAULT_COVER;
    }

    // --- Şarkı Yükleme Mantığı ---
    function loadTrack(index, autoPlay = true) {
      if (index < 0 || index >= tracks.length) return;
      currentTrackIndex = index;
      const track = tracks[currentTrackIndex];

      // Arayüz Bilgilerini Güncelle
      playerTitle.textContent = track.title;
      playerArtist.textContent = track.artist;
      document.getElementById('header-title').textContent = track.title;

      // Resim/Video Ayarları
      if (track.type === 'video') {
        playerCover.classList.add('hidden');
        playerVideo.classList.remove('hidden');
        playerVideo.src = track.mediaUrl;
        mediaBadge.innerHTML = `<i class="fa-solid fa-video"></i> Klip`;
      } else {
        playerVideo.classList.add('hidden');
        playerCover.classList.remove('hidden');
        playerCover.src = track.coverUrl || DEFAULT_COVER;
        mediaBadge.innerHTML = `<i class="fa-solid fa-music"></i> Audio`;
      }

      // Tab İçerikleri
      document.getElementById('tab-content-lyrics').textContent = track.lyrics || 'Bu şarkı için henüz söz eklenmedi.';
      document.getElementById('credit-songwriter').textContent = track.songwriter || track.artist;
      document.getElementById('credit-arranger').textContent = track.arranger || 'Zaman Perdesi';
      document.getElementById('credit-label').textContent = track.label || 'Zaman Perdesi Music';

      // Beğeni Butonu
      const iconLike = document.getElementById('icon-like');
      if (track.liked) {
        iconLike.className = 'fa-solid fa-heart text-red-500';
      } else {
        iconLike.className = 'fa-regular fa-heart';
      }

      // Yorumları Yükle
      renderComments();

      // Ses Motoru
      audioElement.src = track.mediaUrl;
      audioElement.load();

      if (autoPlay) {
        playTrack();
      } else {
        pauseTrack();
      }
    }

    // --- Audio Event Listeners ---
    function setupAudioEvents() {
      audioElement.ontimeupdate = () => {
        if (audioElement.duration) {
          const progress = (audioElement.currentTime / audioElement.duration) * 100;
          seekSlider.value = progress || 0;
          currentTimeEl.textContent = formatTime(audioElement.currentTime);
          totalDurationEl.textContent = formatTime(audioElement.duration);
        }
      };

      audioElement.onended = () => {
        nextTrack();
      };

      audioElement.onerror = () => {
        showToast("Ses dosyası oynatılamadı. Geçersiz medya URL'si.");
        pauseTrack();
      };
    }

    // --- Oynatma Kumandaları ---
    function togglePlayPause() {
      if (isPlaying) {
        pauseTrack();
      } else {
        playTrack();
      }
    }

    function playTrack() {
      if (!audioElement.src) {
        showToast("Lütfen geçerli bir ses dosyası seçin");
        return;
      }
      audioElement.play().then(() => {
        isPlaying = true;
        iconPlay.className = "fa-solid fa-pause";
        if (tracks[currentTrackIndex].type === 'video') playerVideo.play();
      }).catch(err => {
        showToast("Oynatma başlatılamadı. Dosyayı kontrol edin.");
        console.error(err);
      });
    }

    function pauseTrack() {
      audioElement.pause();
      isPlaying = false;
      iconPlay.className = "fa-solid fa-play ml-1";
      if (tracks[currentTrackIndex].type === 'video') playerVideo.pause();
    }

    function prevTrack() {
      const newIndex = (currentTrackIndex - 1 + tracks.length) % tracks.length;
      loadTrack(newIndex, true);
    }

    function nextTrack() {
      const newIndex = (currentTrackIndex + 1) % tracks.length;
      loadTrack(newIndex, true);
    }

    function onSeek(value) {
      if (audioElement.duration) {
        const targetTime = (value / 100) * audioElement.duration;
        audioElement.currentTime = targetTime;
      }
    }

    function toggleLike() {
      tracks[currentTrackIndex].liked = !tracks[currentTrackIndex].liked;
      saveTracksToStorage();
      const iconLike = document.getElementById('icon-like');
      if (tracks[currentTrackIndex].liked) {
        iconLike.className = 'fa-solid fa-heart text-red-500';
        showToast('Favorilere eklendi');
      } else {
        iconLike.className = 'fa-regular fa-heart';
        showToast('Favorilerden çıkarıldı');
      }
    }

    // --- Tab Geçişleri (Sözler, Künye, Yorumlar) ---
    function switchTab(tabName) {
      ['lyrics', 'credits', 'comments'].forEach(t => {
        document.getElementById(`tab-content-${t}`).classList.add('hidden');
        const btn = document.getElementById(`tab-btn-${t}`);
        btn.className = "flex-1 py-1.5 text-xs font-semibold text-gray-400 hover:text-white rounded-lg transition text-center flex items-center justify-center gap-1.5";
      });

      document.getElementById(`tab-content-${tabName}`).classList.remove('hidden');
      const activeBtn = document.getElementById(`tab-btn-${tabName}`);
      activeBtn.className = "flex-1 py-1.5 text-xs font-semibold text-brand-400 border-b-2 border-brand-400 transition text-center flex items-center justify-center gap-1.5";
    }

    // --- Yorum İşlemleri ---
    function renderComments() {
      const commentsList = document.getElementById('comments-list');
      const track = tracks[currentTrackIndex];
      commentsList.innerHTML = '';

      if (!track.comments || track.comments.length === 0) {
        commentsList.innerHTML = `<p class="text-xs text-gray-500 text-center py-2">Henüz yorum yapılmamış.</p>`;
        return;
      }

      track.comments.forEach(c => {
        const item = document.createElement('div');
        item.className = "bg-gray-800/50 p-2 rounded-lg border border-gray-800 text-xs";
        item.innerHTML = `<span class="font-bold text-brand-400">${c.user}: </span><span class="text-gray-300">${c.text}</span>`;
        commentsList.appendChild(item);
      });
    }

    function addComment() {
      const input = document.getElementById('input-comment');
      const val = input.value.trim();
      if (!val) return;

      if (!tracks[currentTrackIndex].comments) {
        tracks[currentTrackIndex].comments = [];
      }

      tracks[currentTrackIndex].comments.push({
        user: userRole === 'admin' ? 'Kuzeyfe (Admin)' : 'Dinleyici',
        text: val
      });

      saveTracksToStorage();
      input.value = '';
      renderComments();
      showToast('Yorum eklendi');
    }

    // --- Sayfa / Görünüm Geçişleri ---
    function switchView(viewName) {
      ['player', 'library', 'upload', 'profile'].forEach(v => {
        document.getElementById(`view-${v}`).classList.add('hidden');
        const navBtn = document.getElementById(`nav-${v}`);
        if (navBtn) navBtn.className = "flex flex-col items-center gap-1 text-gray-400 hover:text-white";
      });

      document.getElementById(`view-${viewName}`).classList.remove('hidden');
      const activeNav = document.getElementById(`nav-${viewName}`);
      if (activeNav) activeNav.className = "flex flex-col items-center gap-1 text-brand-400";

      // Header Güncelle
      const subTitle = document.getElementById('header-subtitle');
      if (viewName === 'player') subTitle.textContent = "ŞİMDİ ÇALINIYOR";
      if (viewName === 'library') subTitle.textContent = "KİTAPLIK";
      if (viewName === 'upload') subTitle.textContent = "İÇERİK YÜKLE";
      if (viewName === 'profile') subTitle.textContent = "PROFİL VE AYARLAR";
    }

    // --- Kütüphane Listeleme ---
    function renderLibrary() {
      const listContainer = document.getElementById('track-list');
      listContainer.innerHTML = '';

      tracks.forEach((track, idx) => {
        const card = document.createElement('div');
        card.className = `flex items-center gap-3 p-2.5 rounded-xl border transition cursor-pointer ${idx === currentTrackIndex ? 'bg-brand-500/10 border-brand-500/40' : 'bg-panelbg/60 border-gray-800 hover:bg-panelbg'}`;
        
        card.innerHTML = `
          <img src="${track.coverUrl || DEFAULT_COVER}" onerror="handleImageError(this)" class="w-12 h-12 rounded-lg object-cover">
          <div class="flex-1 min-w-0">
            <h4 class="text-xs font-bold text-white truncate">${track.title}</h4>
            <p class="text-[11px] text-gray-400 truncate">${track.artist}</p>
          </div>
          <button onclick="event.stopPropagation(); loadTrack(${idx}, true); switchView('player');" class="w-8 h-8 rounded-full bg-brand-500/20 text-brand-400 flex items-center justify-center hover:bg-brand-500 hover:text-black transition">
            <i class="fa-solid fa-play text-xs"></i>
          </button>
        `;

        card.onclick = () => {
          loadTrack(idx, true);
          switchView('player');
        };

        listContainer.appendChild(card);
      });
    }

    // --- Yükleme Türü Değiştirme ---
    function setUploadType(type) {
      currentUploadType = type;
      ['single', 'album', 'video'].forEach(t => {
        const btn = document.getElementById(`type-btn-${t}`);
        btn.className = "flex-1 py-2 rounded-lg text-gray-400 hover:text-white";
      });
      const active = document.getElementById(`type-btn-${type}`);
      active.className = "flex-1 py-2 rounded-lg bg-brand-500 text-black font-bold";

      const labelMedia = document.getElementById('label-media-file');
      if (type === 'video') {
        labelMedia.textContent = "Video Klip Dosyası (MP4)";
      } else {
        labelMedia.textContent = "Ses Dosyası (MP3/WAV)";
      }
    }

    // --- Form Yükleme İşlemi ---
    function handleUpload(e) {
      e.preventDefault();

      const title = document.getElementById('up-title').value;
      const artist = document.getElementById('up-artist').value;
      const songwriter = document.getElementById('up-songwriter').value;
      const arranger = document.getElementById('up-arranger').value;
      const lyrics = document.getElementById('up-lyrics').value;
      const coverFileInput = document.getElementById('up-cover-file');
      const mediaFileInput = document.getElementById('up-media-file');

      if (!mediaFileInput.files[0]) {
        showToast("Lütfen bir medya dosyası seçin");
        return;
      }

      // Blob URL Oluşturma (Lokal Oynatma İçin)
      const mediaUrl = URL.createObjectURL(mediaFileInput.files[0]);
      let coverUrl = DEFAULT_COVER;

      if (coverFileInput.files[0]) {
        coverUrl = URL.createObjectURL(coverFileInput.files[0]);
      }

      const newTrack = {
        id: Date.now().toString(),
        title,
        artist,
        songwriter: songwriter || artist,
        arranger: arranger || "Zaman Perdesi",
        label: "Zaman Perdesi Music",
        coverUrl,
        mediaUrl,
        type: currentUploadType === 'video' ? 'video' : 'audio',
        lyrics,
        comments: [],
        liked: false
      };

      tracks.unshift(newTrack);
      saveTracksToStorage();
      renderLibrary();
      
      // Formu temizle ve oynat
      document.getElementById('upload-form').reset();
      showToast("İçerik başarıyla yüklendi!");
      loadTrack(0, true);
      switchView('player');
    }

    // --- Profil Ekranı & Rol Değiştirme ---
    function renderProfile() {
      const container = document.getElementById('profile-container');
      container.innerHTML = `
        <div class="w-16 h-16 rounded-full bg-brand-500/20 text-brand-400 flex items-center justify-center text-2xl font-bold mx-auto border border-brand-500/40">
          <i class="fa-solid fa-user-shield"></i>
        </div>
        <div>
          <h3 class="font-bold text-white text-base">Zaman Perdesi Yetkilisi</h3>
          <p class="text-xs text-gray-400">Aktif Rol: <span class="text-brand-400 font-semibold uppercase">${userRole}</span></p>
        </div>
        <div class="pt-3 border-t border-gray-800 space-y-2">
          <button onclick="toggleRole()" class="w-full bg-panelbg hover:bg-gray-800 text-xs text-gray-300 py-2 rounded-xl border border-gray-700 transition">
            Rolü Değiştir (${userRole === 'admin' ? 'Dinleyici Yap' : 'Admin Yap'})
          </button>
        </div>
      `;
    }

    function toggleRole() {
      userRole = userRole === 'admin' ? 'user' : 'admin';
      localStorage.setItem('zpm_role', userRole);
      renderProfile();
      showToast(`Rol değiştirildi: ${userRole.toUpperCase()}`);
    }

    // --- Zaman Biçimlendirme Yardımcısı ---
    function formatTime(seconds) {
      if (isNaN(seconds)) return "00:00";
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    // --- Toast Bildirim Fonksiyonu ---
    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-msg').textContent = msg;
      toast.classList.remove('opacity-0', '-translate-y-20');
      toast.classList.add('opacity-100', 'translate-y-0');

      setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', '-translate-y-20');
      }, 3000);
    }
  </script>
</body>
</html>
