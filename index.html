<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Zaman Perdesi Music</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: { black: '#0a0a0c', dark: '#121318', card: '#1a1c23', accent: '#00d2ff', blue: '#0072ff' } } } } }
  </script>
</head>
<body class="font-sans antialiased h-screen overflow-hidden flex justify-center bg-black text-gray-100">
  <div class="w-full max-w-md h-full bg-brand-black flex flex-col relative overflow-hidden shadow-2xl border-x border-gray-800">

    <!-- HEADER -->
    <header class="p-4 bg-brand-dark border-b border-gray-800 flex items-center justify-between z-20">
      <div class="flex items-center gap-2">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-brand-blue to-brand-accent flex items-center justify-center text-black font-extrabold text-lg">Z</div>
        <div>
          <h1 class="text-base font-bold text-white">Zaman Perdesi</h1>
          <p class="text-[10px] text-brand-accent font-medium uppercase">MUSIC PLATFORM</p>
        </div>
      </div>
      <div class="bg-brand-card px-3 py-1.5 rounded-full flex items-center gap-1.5">
        <i class="fa-solid fa-user-check text-brand-accent text-xs"></i>
        <span class="text-xs font-semibold">Kuzeyfe</span>
      </div>
    </header>

    <!-- CONTENT -->
    <main class="flex-1 overflow-y-auto p-4 space-y-6 pb-24">
      <section id="tab-home" class="tab-content space-y-4">
        <h3 class="text-sm font-bold text-white flex items-center gap-2"><i class="fa-solid fa-fire text-brand-accent"></i> Öne Çıkan Eserler</h3>
        <div id="feedList" class="space-y-2">
          <div class="p-3 bg-brand-card rounded-xl border border-gray-800 flex justify-between items-center">
            <div><h4 class="text-xs font-bold text-white">Ateş Ve Kumsal</h4><p class="text-[10px] text-gray-400">Hamza Kalafat</p></div>
            <i class="fa-solid fa-play text-brand-accent text-xs"></i>
          </div>
        </div>
      </section>

      <section id="tab-artists" class="tab-content hidden space-y-3">
        <h2 class="text-base font-bold text-white">Sanatçılar</h2>
        <div class="p-3 bg-brand-card rounded-xl border border-gray-800 text-xs">Kuzeyfe - Kurucu</div>
      </section>

      <section id="tab-upload" class="tab-content hidden space-y-3">
        <h2 class="text-base font-bold text-white">Müzik Yükle</h2>
        <input type="text" id="uploadTitle" placeholder="Şarkı Adı" class="w-full bg-brand-card text-xs text-white p-2.5 rounded-xl border border-gray-800">
        <button type="button" id="uploadBtn" class="w-full bg-brand-accent text-black font-bold text-xs py-3 rounded-xl">Yayınla</button>
      </section>

      <section id="tab-profile" class="tab-content hidden space-y-3">
        <h2 class="text-base font-bold text-white">Profilim</h2>
        <div class="p-3 bg-brand-card rounded-xl border border-gray-800 text-xs">kuzeyfe198634@gmail.com</div>
      </section>
    </main>

    <!-- NAVIGATION -->
    <nav class="bg-brand-dark border-t border-gray-800 flex justify-around py-3 z-40">
      <button type="button" data-tab="home" class="nav-btn flex flex-col items-center gap-1 text-brand-accent p-1"><i class="fa-solid fa-house text-base"></i><span class="text-[10px]">Ana Sayfa</span></button>
      <button type="button" data-tab="artists" class="nav-btn flex flex-col items-center gap-1 text-gray-400 p-1"><i class="fa-solid fa-users text-base"></i><span class="text-[10px]">Sanatçılar</span></button>
      <button type="button" data-tab="upload" class="nav-btn flex flex-col items-center gap-1 text-gray-400 p-1"><i class="fa-solid fa-circle-plus text-base"></i><span class="text-[10px]">Yükle</span></button>
      <button type="button" data-tab="profile" class="nav-btn flex flex-col items-center gap-1 text-gray-400 p-1"><i class="fa-solid fa-user text-base"></i><span class="text-[10px]">Profilim</span></button>
    </nav>

  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const btns = document.querySelectorAll('.nav-btn');
      btns.forEach(b => {
        b.addEventListener('click', () => {
          const tab = b.getAttribute('data-tab');
          document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
          document.getElementById('tab-' + tab).classList.remove('hidden');
          btns.forEach(x => { x.classList.remove('text-brand-accent'); x.classList.add('text-gray-400'); });
          b.classList.remove('text-gray-400');
          b.classList.add('text-brand-accent');
        });
      });

      const upBtn = document.getElementById('uploadBtn');
      if(upBtn) {
        upBtn.addEventListener('click', () => {
          const val = document.getElementById('uploadTitle').value;
          if(val) { alert('Yayınlandı: ' + val); document.querySelector('[data-tab="home"]').click(); }
          else { alert('Şarkı adı giriniz!'); }
        });
      }
    });
  </script>
</body>
</html>
