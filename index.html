<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Zaman Perdesi Music</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { black: '#0a0a0c', dark: '#121318', card: '#1a1c23', hover: '#242731', accent: '#00d2ff', blue: '#0072ff' }
          }
        }
      }
    }
  </script>
  <style>
    body { user-select: none; -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="font-sans antialiased h-screen overflow-hidden flex justify-center bg-gray-50 dark:bg-black text-gray-900 dark:text-gray-100">

  <audio id="audioPlayer" preload="auto"></audio>

  <div class="w-full max-w-md h-full bg-white dark:bg-brand-black flex flex-col relative overflow-hidden shadow-2xl border-x border-gray-200 dark:border-gray-800">

    <!-- HEADER -->
    <header class="p-4 bg-white/90 dark:bg-brand-dark/90 backdrop-blur-md border-b border-gray-200 dark:border-gray-800 flex items-center justify-between z-20 flex-shrink-0">
      <div class="flex items-center gap-2">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-brand-blue to-brand-accent flex items-center justify-center text-black font-extrabold text-lg shadow-lg">Z</div>
        <div>
          <h1 class="text-base font-bold tracking-tight text-white">Zaman Perdesi</h1>
          <p class="text-[10px] text-brand-accent font-medium -mt-1 tracking-wider uppercase">MUSIC PLATFORM</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button type="button" id="themeToggleBtn" class="w-8 h-8 rounded-full bg-gray-100 dark:bg-brand-card flex items-center justify-center text-brand-accent text-xs">
          <i id="themeIcon" class="fa-solid fa-moon"></i>
        </button>
        <div id="authBtn" class="flex items-center gap-1.5 bg-gray-100 dark:bg-brand-card px-3 py-1.5 rounded-full cursor-pointer">
          <i class="fa-solid fa-user-check text-brand-accent text-xs"></i>
          <span class="text-xs font-semibold">Kuzeyfe</span>
        </div>
      </div>
    </header>

    <!-- SEARCH BAR -->
    <div class="px-4 py-2.5 bg-gray-50 dark:bg-brand-dark/50 border-b border-gray-800 flex-shrink-0">
      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
        <input type="text" id="searchInput" placeholder="Sanatçı, şarkı veya albüm ara..." 
          class="w-full bg-gray-100 dark:bg-brand-card text-xs text-white pl-9 pr-8 py-2 rounded-xl border border-gray-800 focus:outline-none focus:border-brand-accent">
      </div>
    </div>

    <!-- MAIN CONTAINER -->
    <main class="flex-1 overflow-y-auto p-4 space-y-6 pb-24">

      <!-- TAB 1: ANA SAYFA -->
      <section id="tab-home" class="tab-content space-y-6">
        <div>
          <h3 class="text-sm font-bold text-white mb-3 flex items-center gap-2">
            <i class="fa-solid fa-fire text-brand-accent"></i> Öne Çıkan Eserler
          </h3>
          <div id="feedList" class="space-y-2"></div>
        </div>
      </section>

      <!-- TAB 2: SANATÇILAR -->
      <section id="tab-artists" class="tab-content hidden space-y-4">
        <h2 class="text-base font-bold text-white"><i class="fa-solid fa-users text-brand-accent"></i> Sanatçılar</h2>
        <div class="bg-brand-card p-3 rounded-xl border border-gray-800 text-xs">Kuzeyfe - Zaman Perdesi Kurucusu</div>
      </section>

      <!-- TAB 3: YÜKLE -->
      <section id="tab-upload" class="tab-content hidden space-y-5">
        <h2 class="text-base font-bold text-white"><i class="fa-solid fa-cloud-arrow-up text-brand-accent"></i> Müzik Yükle</h2>
        <div class="space-y-3">
          <input type="text" id="uploadTitle" placeholder="Şarkı Adı" class="w-full bg-brand-card text-xs text-white p-2.5 rounded-xl border border-gray-800">
          <button type="button" id="uploadSubmitBtn" class="w-full bg-brand-accent text-black font-bold text-xs py-3 rounded-xl">Yayınla</button>
        </div>
      </section>

      <!-- TAB 4: PROFİL -->
      <section id="tab-profile" class="tab-content hidden space-y-5">
        <div class="flex items-center gap-3 bg-brand-card p-3.5 rounded-2xl border border-gray-800">
          <div class="w-14 h-14 rounded-full bg-brand-accent flex items-center justify-center text-black font-bold text-xl">K</div>
          <div>
            <h3 class="text-sm font-bold text-white">Kuzeyfe Kalafat</h3>
            <p class="text-[11px] text-gray-400">kuzeyfe198634@gmail.com</p>
          </div>
        </div>
      </section>

    </main>

    <!-- MINI PLAYER -->
    <div class="bg-brand-dark border-t border-cyan-500/30 p-3 flex items-center justify-between z-30 flex-shrink-0">
      <div class="flex items-center gap-2.5 min-w-0 flex-1">
        <div class="w-10 h-10 rounded-lg bg-brand-accent/20 flex items-center justify-center text-brand-accent"><i class="fa-solid fa-music"></i></div>
        <div class="min-w-0 flex-1">
          <h4 id="playerTitle" class="text-xs font-bold text-white truncate">Ateş Ve Kumsal</h4>
          <p id="playerArtist" class="text-[10px] text-brand-accent truncate">Hamza Kalafat</p>
        </div>
      </div>
      <button type="button" id="playPauseBtn" class="w-8 h-8 rounded-full bg-brand-accent text-black flex items-center justify-center font-bold"><i class="fa-solid fa-play text-xs"></i></button>
    </div>

    <!-- ALT SEKMELER -->
    <nav class="bg-brand-dark border-t border-gray-800 flex justify-around py-3 z-40 flex-shrink-0">
      <button type="button" data-tab="home" class="nav-btn flex flex-col items-center gap-1 text-brand-accent cursor-pointer p-1"><i class="fa-solid fa-house text-base"></i><span class="text-[10px]">Ana Sayfa</span></button>
      <button type="button" data-tab="artists" class="nav-btn flex flex-col items-center gap-1 text-gray-400 cursor-pointer p-1"><i class="fa-solid fa-users text-base"></i><span class="text-[10px]">Sanatçılar</span></button>
      <button type="button" data-tab="upload" class="nav-btn flex flex-col items-center gap-1 text-gray-400 cursor-pointer p-1"><i class="fa-solid fa-circle-plus text-base"></i><span class="text-[10px]">Yükle</span></button>
      <button type="button" data-tab="profile" class="nav-btn flex flex-col items-center gap-1 text-gray-400 cursor-pointer p-1"><i class="fa-solid fa-user text-base"></i><span class="text-[10px]">Profilim</span></button>
    </nav>

  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      // Sekme Geçişleri
      const navButtons = document.querySelectorAll('.nav-btn');
      navButtonsforEachSafely = navButtons.forEach(btn => {
        btn.addEventListener('click', function() {
          const targetTab = this.getAttribute('data-tab');
          
          document.querySelectorAll('.tab-content').forEach(sec => sec.classList.add('hidden'));
          const activeSec = document.getElementById('tab-' + targetTab);
          if(activeSec) activeSec.classList.remove('hidden');

          navButtons.forEach(b => {
            b.classList.remove('text-brand-accent');
            b.classList.add('text-gray-400');
          });
          this.classList.remove('text-gray-400');
          this.classList.add('text-brand-accent');
        });
      });

      // Tema Değiştirici
      const themeBtn = document.getElementById('themeToggleBtn');
      if(themeBtn) {
        themeBtn.addEventListener('click', function() {
          document.documentElement.classList.toggle('dark');
        });
      }

      // Örnek Şarkı Listesi Render
      let tracks = [
        { title: 'Ateş Ve Kumsal', artist: 'Hamza Kalafat' },
        { title: 'Zirve Yolu', artist: 'Kuzeyfe' }
      ];

      const feedList = document.getElementById('feedList');
      if(feedList) {
        feedList.innerHTML = tracks.map(t => `
          <div class="flex items-center justify-between p-3 rounded-xl bg-brand-card border border-gray-800">
            <div>
              <h4 class="text-xs font-bold text-white">${t.title}</h4>
              <p class="text-[10px] text-gray-400">${t.artist}</p>
            </div>
            <i class="fa-solid fa-play text-brand-accent text-xs"></i>
          </div>
        `).join('');
      }

      // Yükle Butonu
      const uploadBtn = document.getElementById('uploadSubmitBtn');
      if(uploadBtn) {
        uploadBtn.addEventListener('click', function() {
          const titleInput = document.getElementById('uploadTitle');
          if(titleInput && titleInput.value.trim()) {
            alert('Eser başarıyla yayınlandı: ' + titleInput.value);
            titleInput.value = '';
            document.querySelector('[data-tab="home"]').click();
          } else {
            alert('Lütfen şarkı adını giriniz!');
          }
        });
      }
    });
  </script>
</body>
</html>
