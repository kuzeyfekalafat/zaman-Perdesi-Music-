<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zaman Perdesi - Music & Video Platform (Cloud)</title>
    
    <!-- FontAwesome Orijinal İkonlar için Kütüphane -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Firebase SDK v9 (Modular CDN) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail, signOut, onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, doc, setDoc, updateDoc, deleteDoc, increment, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAnmVE-9T0T6lDhQeafto4V-p0R6ZexGSA",
            authDomain: "zamanperdesimusic-c3150.firebaseapp.com",
            projectId: "zamanperdesimusic-c3150",
            storageBucket: "zamanperdesimusic-c3150.appspot.com",
            messagingSenderId: "1041697921243",
            appId: "1:1041697921243:web:298a0206d4f9cebd14fe"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);

        window.firebaseApp = { auth, db, storage, signInWithEmailAndPassword, sendPasswordResetEmail, signOut, updateProfile, collection, addDoc, getDocs, doc, setDoc, updateDoc, deleteDoc, increment, ref, uploadBytes, getDownloadURL };

        const ADMIN_EMAIL = "kuzeyfe198634@gmail.com";

        onAuthStateChanged(auth, (user) => {
            const profileTag = document.getElementById('userProfileTag');
            const adminTabBtn = document.getElementById('adminTabBtn');

            if (user && user.email === ADMIN_EMAIL) {
                window.isAdminLoggedIn = true;
                profileTag.innerText = "Patron Kuzeyfe ✓";
                if(adminTabBtn) adminTabBtn.style.display = 'inline-block';
            } else {
                window.isAdminLoggedIn = false;
                if(user) { signOut(auth); }
                profileTag.innerText = "Patron Girişi";
                if(adminTabBtn) adminTabBtn.style.display = 'none';
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('albumTracksSlots');
            if(container) {
                container.innerHTML = '';
                for(let i = 1; i <= 15; i++) {
                    container.innerHTML += `
                        <div class="track-slot-row">
                            <span>#${i}</span>
                            <input type="text" id="albumTrackName_${i}" placeholder="${i}. Şarkı Adı">
                            <input type="file" id="albumTrackFile_${i}">
                        </div>
                    `;
                }
            }
            loadCloudSongs();
        });

        async function loadCloudSongs() {
            const { db, collection, getDocs } = window.firebaseApp;
            const anasayfaContainer = document.getElementById('dynamicSongList');
            const sarkilarContainer = document.getElementById('dynamicSongListAll');

            try {
                const querySnapshot = await getDocs(collection(db, "songs"));
                if(querySnapshot.empty) {
                    if(anasayfaContainer) anasayfaContainer.innerHTML = '<div class="empty-state">Bulutta henüz şarkı yok kanka.</div>';
                    if(sarkilarContainer) sarkilarContainer.innerHTML = '<div class="empty-state">Bulutta henüz şarkı yok kanka.</div>';
                    return;
                }

                let htmlContent = '';
                querySnapshot.forEach((docSnap) => {
                    const song = docSnap.data();
                    const creditsText = song.credits || `🎵 ${song.title} - KÜNYE\n--------------------------------------------------\n• Söz & Müzik : Kuzeyfe Kalafat\n• Aranjör & Prodüktör : Zaman Perdesi Music & Kuzeyfe Kalafat\n• Görsel & Kapak Tasarımı : Kuzeyfe Kalafat\n• Yapım & Yönetim : Zaman Perdesi Music & Kuzeyfe Kalafat`;

                    htmlContent += `
                        <div class="content-card">
                            <div class="content-main-row">
                                <div class="content-info">
                                    <h4>${song.title || 'İsimsiz Parça'}</h4>
                                    <p>Kuzeyfe Kalafat <span class="verified-tick">✓</span></p>
                                </div>
                                <div class="view-count-badge">🎧 ${song.plays || 0} Dinlenme</div>
                            </div>

                            ${song.audioUrl ? `
                                <div style="margin-top: 12px;">
                                    <audio controls style="width: 100%; height: 38px;">
                                        <source src="${song.audioUrl}" type="audio/mp3">
                                        Tarayıcınız ses oynatıcısını desteklemiyor.
                                    </audio>
                                </div>
                            ` : '<p style="font-size:0.75rem; color:#ff4757; margin-top:8px;">⚠️ Bu şarkıda ses dosyası bağlantısı yok.</p>'}

                            ${song.lyrics ? `
                                <div style="margin-top: 12px;">
                                    <label style="font-size: 0.75rem; color: var(--gold); margin-bottom: 3px;">Şarkı Sözleri:</label>
                                    <p style="font-size:0.82rem; color:var(--text-main); white-space:pre-line; background: rgba(0,0,0,0.25); padding: 10px; border-radius: 6px; border: 1px solid var(--panel-border);">${song.lyrics}</p>
                                </div>
                            ` : ''}

                            <div style="margin-top: 12px;">
                                <label style="font-size: 0.75rem; color: var(--gold); margin-bottom: 3px;">Resmi Künye:</label>
                                <textarea rows="5" readonly style="color: var(--gold); background: #0a0a0a; font-size: 0.78rem; width: 100%; border: 1px solid var(--panel-border); border-radius: 6px; padding: 8px; cursor: not-allowed;">${creditsText}</textarea>
                            </div>

                            <div class="card-actions-row">
                                <button class="btn-favorite-action" onclick="toggleFavorite(this, '${docSnap.id}')">⭐ Favorilere Ekle</button>
                                <button class="btn-comment-toggle" onclick="toggleComments('comment_box_${docSnap.id}')">💬 Yorumlar (0)</button>
                            </div>
                            <div id="comment_box_${docSnap.id}" class="comments-section">
                                <div class="comment-input-box">
                                    <input type="text" placeholder="Yorum yaz...">
                                    <button onclick="alert('Yorum buluta eklendi!')">Gönder</button>
                                </div>
                            </div>
                        </div>
                    `;
                });

                if(anasayfaContainer) anasayfaContainer.innerHTML = htmlContent;
                if(sarkilarContainer) sarkilarContainer.innerHTML = htmlContent;
            } catch (e) {
                console.error("Şarkı yükleme hatası:", e);
            }
        }
        window.loadCloudSongs = loadCloudSongs;
    </script>

    <style>
        :root {
            --bg-color: #0d0d0d;
            --panel-bg: #141414;
            --panel-border: #222222;
            --gold: #d4af37;
            --gold-hover: #e5c158;
            --text-main: #f5f5f5;
            --text-muted: #888888;
            --verified-blue: #1d9bf0;
            --admin-red: #ff4757;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding-bottom: 90px; }
        header { padding: 16px 20px; border-bottom: 1px solid var(--panel-border); display: flex; justify-content: space-between; align-items: center; background: var(--bg-color); position: sticky; top: 0; z-index: 100; }
        .brand-box h1 { font-size: 1.2rem; color: var(--gold); font-weight: 700; cursor: pointer; }
        .brand-box p { font-size: 0.7rem; color: var(--text-muted); }
        .user-profile-tag { display: flex; align-items: center; gap: 6px; font-size: 0.9rem; font-weight: 600; color: var(--text-main); background: var(--panel-bg); border: 1px solid var(--panel-border); padding: 6px 12px; border-radius: 20px; cursor: pointer; }
        .verified-tick { background: var(--verified-blue); color: #fff; border-radius: 50%; width: 15px; height: 15px; font-size: 9px; display: inline-flex; align-items: center; justify-content: center; font-weight: bold; }
        .nav-tabs { display: flex; gap: 6px; padding: 12px 16px; overflow-x: auto; background: var(--bg-color); border-bottom: 1px solid var(--panel-border); white-space: nowrap; scrollbar-width: thin; scrollbar-color: var(--gold) var(--panel-bg); }
        .tab-btn { background: var(--panel-bg); border: 1px solid var(--panel-border); color: var(--text-muted); padding: 8px 14px; border-radius: 20px; font-size: 0.85rem; cursor: pointer; transition: all 0.2s ease; flex-shrink: 0; }
        .tab-btn.active { background: var(--gold); color: #000; border-color: var(--gold); font-weight: 600; }
        .tab-btn.admin-tab-btn { background: rgba(255, 71, 87, 0.15); border-color: var(--admin-red); color: var(--admin-red); font-weight: bold; display: none; }
        .tab-btn.admin-tab-btn.active { background: var(--admin-red); color: #fff; }
        .container { padding: 20px; max-width: 800px; margin: 0 auto; }
        .section-content { display: none; }
        .section-content.active { display: block; }
        h2.section-title { font-size: 1.2rem; color: var(--gold); margin-bottom: 16px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px; }
        input[type="text"], input[type="email"], input[type="password"], select, textarea { width: 100%; background: var(--panel-bg); border: 1px solid var(--panel-border); color: var(--text-main); padding: 12px; border-radius: 8px; font-size: 0.95rem; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--gold); }
        .btn-gold { background: var(--gold); color: #000; border: none; width: 100%; padding: 12px; border-radius: 8px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: background 0.2s; }
        .btn-gold:hover { background: var(--gold-hover); }
        .file-input-wrapper { background: var(--panel-bg); border: 1px solid var(--panel-border); padding: 10px; border-radius: 8px; }
        .album-tracks-container { border: 1px dashed var(--panel-border); background: rgba(0,0,0,0.15); padding: 12px; border-radius: 8px; margin-bottom: 16px; }
        .track-slot-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; background: var(--panel-bg); padding: 8px; border-radius: 6px; border: 1px solid var(--panel-border); }
        .track-slot-row span { font-size: 0.8rem; color: var(--gold); font-weight: bold; min-width: 25px; }
        .track-slot-row input[type="text"] { padding: 6px 10px; font-size: 0.85rem; flex: 1; }
        .track-slot-row input[type="file"] { font-size: 0.75rem; color: var(--text-muted); flex: 1.2; }
        .empty-state { color: var(--text-muted); font-size: 0.9rem; text-align: center; padding: 40px 0; }
        .content-card { background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 8px; padding: 14px; margin-bottom: 12px; }
        .content-main-row { display: flex; justify-content: space-between; align-items: center; }
        .content-info h4 { font-size: 0.95rem; color: var(--text-main); margin-bottom: 3px; }
        .content-info p { font-size: 0.78rem; color: var(--text-muted); }
        .view-count-badge { background: rgba(212, 175, 55, 0.1); color: var(--gold); border: 1px solid rgba(212, 175, 55, 0.3); padding: 4px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: bold; }
        .card-actions-row { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.05); }
        .btn-comment-toggle { background: none; border: none; color: var(--gold); font-size: 0.8rem; cursor: pointer; font-weight: 600; }
        .btn-favorite-action { background: none; border: 1px solid var(--panel-border); color: var(--text-muted); padding: 4px 10px; border-radius: 6px; font-size: 0.78rem; cursor: pointer; }
        .btn-favorite-action.favorited { background: rgba(212, 175, 55, 0.15); border-color: var(--gold); color: var(--gold); }
        .comments-section { display: none; margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--panel-border); }
        .comments-section.open { display: block; }
        .comment-input-box { display: flex; gap: 6px; margin-top: 8px; }
