<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Zaman Perdesi Music</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { black: '#0a0a0c', dark: '#121318', card: '#1a1c23', accent: '#00d2ff', blue: '#0072ff' }
          }
        }
      }
    }
  </script>
</head>
<body class="font-sans antialiased h-screen overflow-hidden flex justify-center bg-gray-50 dark:bg-black text-gray-900 dark:text-gray-100">

  <audio id="audioPlayer" preload="auto"></audio>

  <div class="w-full max-w-md h-full bg-white dark:bg-brand-black flex flex-col relative overflow-hidden shadow-2xl border-x border-gray-200 dark:border-gray-800">

    <!-- HEADER -->
    <header class="p-4 bg-white/90 dark:bg-brand-dark/90 backdrop-blur-md border-b border-gray-200 dark:border-gray-800 flex items-center justify-between z-20 flex-shrink-0">
      <div class="flex items-center gap-2">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-brand-blue to-brand-accent flex items-center justify-center text-black font-extrabold text-lg">Z</div>
        <div>
          <h1 class="text-base font-bold text-gray-900 dark:text-white">Zaman Perdesi</h1>
          <p class="text-[10px] text-brand-accent font-medium uppercase">MUSIC PLATFORM</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button type="button" onclick="toggleTheme()" class="w-8 h-8 rounded-full bg-gray-100 dark:bg-brand-card flex items-center justify-center text-brand-accent text-xs cursor-pointer">
          <i id="themeIcon" class="fa-solid fa-moon"></i>
        </button>
        <div class="flex items-center gap-1.5 bg-gray-100 dark:bg-brand-card px-3 py-1.5 rounded-full">
          <i class="fa-solid fa-user-check text-brand-accent text-xs"></i>
          <span class="text-xs font-semibold">Kuzeyfe</span>
        </div>
      </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="flex-1 overflow-y-auto p-4 space-y-6 pb-24">
      
      <!-- TAB 1: ANA SAYFA -->
      <section id="tab-home" class="tab-content space-y-4">
        <h3 class="text-sm font-bold text-gray-900 dark:text-white flex items-center gap-2"><i class="fa-solid fa-fire text-brand-accent"></i> Öne Çıkan Eserler</h3>
        <div class="p-3 bg-gray-100 dark:bg-brand-card rounded-xl border border-gray-200 dark:border-gray-800 flex justify-between items-center cursor-pointer" onclick="playSample()">
          <div><h4 class="text-xs font-bold text-gray-900 dark:text-white">Ateş Ve Kumsal</h4><p class="text-[10px] text-gray-500">Hamza Kalafat</p></div>
          <i class="fa-solid fa-play text-brand-accent text-xs"></i>
        </div>
      </section>

      <!-- TAB 2: SANATÇILAR -->
      <section id="tab-artists" class="tab-content hidden space-y-3">
        <h2 class="text-base font-bold text-gray-900 dark:text-white">Sanatçılar Kataloğu</h2>
        <div class="p-3 bg-gray-100 dark:bg-brand-card rounded-xl border border-gray-200 dark:border-gray-800 text-xs">Kuzeyfe - Zaman Perdesi Kurucusu</div>
      </section>

      <!-- TAB 3: YÜKLE -->
      <section id="tab-upload" class="tab-content hidden space-y-3">
        <h2 class="text-base font-bold text-gray-900 dark:text-white">Müzik Yükle</h2>
        <input type="text" id="uploadTitle" placeholder="Şarkı Adı" class="w-full bg-gray-100 dark:bg-brand-card text-xs text-gray-900 dark:text-white p-2.5 rounded-xl border border-gray-200 dark:border-gray-800">
        <button type="button" onclick="handleUpload()" class="w-full bg-brand-accent text-black font-bold text-xs py-3 rounded-xl cursor-pointer">Yayınla</button>
      </section>

      <!-- TAB 4: PROFİL -->
      <section id="tab-profile" class="tab-content hidden space-y-3">
        <h2 class="text-base font-bold text-gray-900 dark:text-white">Profilim</h2>
        <div class="p-3 bg-gray-100 dark:bg-brand-card rounded-xl border border-gray-200 dark:border-gray-800 text-xs">kuzeyfe198634@gmail.com</div>
      </section>

    </main>

    <!-- ALT SEKMELER (NAV) - DOĞRUDAN FONKSİYON BAĞLI -->
    <nav class="bg-white dark:bg-brand-dark border-t border-gray-200 dark:border-gray-800 flex justify-around py-3 z-40 flex-shrink-0">
      <button type="button" onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center gap-1 text-brand-accent cursor-pointer p-1"><i class="fa-solid fa-house text-base"></i><span class="text-[10px] font-semibold">Ana Sayfa</span></button>
      <button type="button" onclick="switchTab('artists')" id="nav-artists" class="flex flex-col items-center gap-1 text-gray-400 cursor-pointer p-1"><i class="fa-solid fa-users text-base"></i><span class="text-[10px] font-semibold">Sanatçılar</span></button>
      <button type="button" onclick="switchTab('upload')" id="nav-upload" class="flex flex-col items-center gap-1 text-gray-400 cursor-pointer p-1"><i class="fa-solid fa-circle-plus text-base"></i><span class="text-[10px] font-semibold">Yükle</span></button>
      <button type="button" onclick="switchTab('profile')" id="nav-profile" class="flex flex-col items-center gap-1 text-gray-400 cursor-pointer p-1"><i class="fa-solid fa-user text-base"></i><span class="text-[10px] font-semibold">Profilim</span></button>
    </nav>

  </div>

  <script>
    // SEKME DEĞİŞTİRME FONKSİYONU (GLOBAL)
    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      const target = document.getElementById('tab-' + tabName);
      if(target) target.classList.remove('hidden');

      ['home', 'artists', 'upload', 'profile'].forEach(t => {
        const btn = document.getElementById('nav-' + t);
        if(btn) {
          btn.className = t === tabName 
            ? "flex flex-col items-center gap-1 text-brand-accent cursor-pointer p-1" 
            : "flex flex-col items-center gap-1 text-gray-400 cursor-pointer p-1";
        }
      });
    }

    // TEMA DEĞİŞTİRİCİ
    function toggleTheme() {
      document.documentElement.classList.toggle('dark');
      const icon = document.getElementById('themeIcon');
      if(icon) {
        icon.className = document.documentElement.classList.contains('dark') ? "fa-solid fa-moon" : "fa-solid fa-sun";
      }
    }

    // ÖRNEK OYNATICI
    function playSample() {
      const audio = document.getElementById('audioPlayer');
      audio.src = 'https://actions.google.com/sounds/v1/ambiences/outdoor_synth.ogg';
      audio.play();
      alert('Şarkı oynatılıyor...');
    }

    // YÜKLEME İŞLEMİ
    function handleUpload() {
      const title = document.getElementById('uploadTitle').value;
      if(title.trim()) {
        alert('Eser başarıyla yayınlandı: ' + title);
        document.getElementById('uploadTitle').value = '';
        switchTab('home');
      } else {
        alert('Lütfen şarkı adını giriniz!');
      }
    }
  </script>
</body>
</html>
